server {
    listen 80;
    server_name _;

    # public/ is the only web-exposed directory; the rest of the repo sits
    # outside the docroot. app is the docker-compose service running php-fpm.
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Matches the PHP upload limits in docker/php/php.ini (20M/24M).
    client_max_body_size 24m;

    # The official nginx image already symlinks access.log/error.log to stdout
    # and stderr, so no logging directives are needed here.

    # Symfony ships the front controller as index.php; send everything that is
    # not a real file there.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Only the front controller may execute; anything else that reaches here
        # is a mistake and must not be handed to PHP.
        internal;
    }

    # Uploaded files live under public/uploads and are served directly.
    location ^~ /uploads/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # No PHP execution anywhere else (defence in depth).
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
