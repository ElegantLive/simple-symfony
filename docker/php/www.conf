; php-fpm pool overrides for the Symfony app.
; Loaded as php-fpm.d/zz-app.conf, so it is read after www.conf.

[www]
user = www-data
group = www-data

; IMPORTANT: the stock pool sets clear_env = yes, which strips everything passed
; through `docker compose run/environment`. Symfony reads DATABASE_URL, REDIS_DSN,
; APP_SECRET, ... from the real environment, so it must be disabled.
clear_env = no

listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no

; Deliberately no php_admin_value[error_log] here. The stock image already sends
; FPM/PHP output to /proc/self/fd/2 (see php-fpm.d/docker.conf), and overriding
; it from this file is what made FPM fail with
; "failed to open error_log (/proc/self/fd/2): Permission denied".
