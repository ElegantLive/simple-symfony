; Development-oriented PHP settings for the Symfony 4.3 app.
; Mounted as conf.d/zz-app.ini so it wins over the stock php.ini-production.

[PHP]
memory_limit = 512M
max_execution_time = 120

; Surfaced in the browser / logs during local development.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; The app uploads images to public/uploads.
upload_max_filesize = 20M
post_max_size = 24M

date.timezone = UTC

[opcache]
; Local development: always re-read the mounted PHP files.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
