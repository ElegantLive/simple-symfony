name: CI

on:
  push:
    branches: [master]
  pull_request:

# The job only reads the repository.
permissions:
  contents: read

jobs:
  tests:
    name: Lint + tests (PHP 7.3)
    runs-on: ubuntu-22.04

    # APP_ENV has to be a real environment variable and not just a line in
    # .env.test: config/bootstrap.php chooses WHICH dotenv file to load based on
    # APP_ENV, so a value that only exists inside .env.test cannot select itself.
    # Everything else (DSNs, secrets) comes from the committed .env.test.
    env:
      APP_ENV: test

    # The functional suite drives the application over real HTTP, so the services
    # the application itself needs have to be here: MySQL because the schema uses
    # enum columns and there is no SQLite fallback, and MailHog because the
    # registration and password-change flows mail a six-digit code that is never
    # returned in a response - reading it back out of MailHog is the only way to
    # exercise them end to end.
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: simple_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 7.3
        uses: shivammathur/setup-php@v2
        with:
          # Matches docker/php/Dockerfile and composer.json ("php": "^7.1.3").
          php-version: '7.3'
          # The same set the image installs: composer.json requires ctype, iconv,
          # json, bcmath and openssl, and the bundles need the rest.
          extensions: bcmath, ctype, iconv, intl, mbstring, openssl, pdo_mysql, zip
          # No coverage driver: the functional tests are served by a separate PHP
          # process, so their coverage cannot be collected here anyway, and Xdebug
          # makes every run slower. See tests/Support/route-coverage.php.
          coverage: none

      - name: Diagnostics
        # Cheap, and it means a failure in this job explains itself instead of
        # needing a guess from the outside.
        run: |
          echo "user          : $(id -un) (uid $(id -u))"
          echo "php           : $(php -v | head -1)"
          echo "composer PATH : $(command -v composer || echo none)"
          composer --version 2>/dev/null | head -1 || true
          echo "RUNNER_TEMP   : $RUNNER_TEMP (writable: $([ -w "$RUNNER_TEMP" ] && echo yes || echo no))"
          echo "workdir       : $PWD"
          echo "APP_ENV       : $APP_ENV"

      - name: Fetch Composer 1
        # composer.lock pins symfony/flex v1.4.5 and ocramius/package-versions
        # 1.4.0, both of which declare "composer-plugin-api": "^1.0". Composer 2
        # provides 2.2.0 and refuses the lock outright, so this must be Composer 1,
        # for the same reason docker/php/Dockerfile pins it.
        #
        # Fetched into $RUNNER_TEMP and always invoked by absolute path rather
        # than installed onto PATH: that avoids needing write access to
        # /usr/local/bin, and it avoids the risk of setup-php's own composer (v2)
        # still winning the PATH lookup and silently being the one that runs.
        #
        # --retry because this step failed once on a transient network error: the
        # run before it passed with an unchanged workflow. A truncated download is
        # a real failure mode too - curl exits 18, and it has happened by hand - so
        # the hash below covers that as well as tampering. The version-pinned URL
        # is immutable, which is what makes pinning the hash meaningful.
        run: |
          curl -sSL --retry 5 --retry-delay 3 --retry-connrefused --max-time 300 \
            -o "$RUNNER_TEMP/composer1.phar" https://getcomposer.org/download/1.10.27/composer.phar
          echo "230d28fb29f3c6c07ab2382390bef313e36de17868b2bd23b2e070554cae23d2  $RUNNER_TEMP/composer1.phar" | sha256sum -c -
          php "$RUNNER_TEMP/composer1.phar" --version
          php "$RUNNER_TEMP/composer1.phar" --version | grep -q '^Composer version 1\.' \
            || { echo "::error::expected Composer 1.x, the lock cannot be installed otherwise"; exit 1; }

      - name: Install dependencies
        # --no-scripts: the auto-scripts boot the kernel (cache:clear,
        # assets:install), which wants a .env and the gitignored
        # config/certificate keys that do not exist yet at this point. Both are
        # created by the next two steps, and nothing here needs a booted kernel.
        run: php "$RUNNER_TEMP/composer1.phar" install --no-scripts --no-interaction --prefer-dist --no-progress

      - name: composer.json is still valid
        # --no-check-lock on purpose. The lock has been stale for a long time
        # ("not up to date with the latest changes in composer.json"), which is a
        # genuine pre-existing problem, but without this flag the step exits 2 on
        # every run and the signal drowns in the noise. Worth fixing separately.
        run: php "$RUNNER_TEMP/composer1.phar" validate --no-check-publish --no-check-lock

      - name: Every PHP file parses
        run: |
          out=$(find src tests -name '*.php' -print0 | xargs -0 -n1 php -l)
          bad=$(printf '%s\n' "$out" | grep -v '^No syntax errors detected' || true)
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "Parsed $(printf '%s\n' "$out" | wc -l) files"

      - name: Install PHPUnit
        # A pinned phar rather than a composer dependency: `composer require`
        # cannot work here (Composer 1 is required, and composer.json still points
        # at the dead packagist.phpcomposer.com), and adding it to the lock would
        # re-resolve a dependency set that is deliberately frozen.
        #
        # 9.6.38 is the last 9.6 release and supports PHP 7.3. The hash is pinned
        # because an exact-version phar is immutable, so a changed hash means a
        # changed artifact. The hash was computed from the artifact itself, not
        # read from a signed release listing - phar.phpunit.de publishes no
        # .sha256 file for these.
        run: |
          curl -sSL --retry 5 --retry-delay 3 --retry-connrefused --max-time 300 \
            -o phpunit.phar https://phar.phpunit.de/phpunit-9.6.38.phar
          echo "6b5235f282c6ccab3674ac27c5b1ddbd1da838e74bf07002ddcfd030d31298d7  phpunit.phar" | sha256sum -c -
          php phpunit.phar --version

      - name: Give the kernel a .env to load
        # .env is gitignored and holds real credentials, so a fresh checkout has
        # none - and config/bootstrap.php calls Dotenv::loadEnv() unconditionally,
        # and Symfony's Dotenv throws PathException when the file is not readable.
        # Until now that never came up because nothing in this job booted the
        # kernel. An empty file satisfies the loader; every value the test
        # environment needs comes from the committed .env.test, which loadEnv()
        # picks up because APP_ENV is test.
        run: touch .env

      - name: Generate the RSA key pairs
        # config/certificate is gitignored, and App\Service\Token (RS256) and
        # App\Service\Signature both read their keys from it. These are throwaway
        # keys for one run: nothing is pinned against them outside this job.
        run: sh docker/gen-certificates.sh --bits 2048

      - name: Prepare the runtime directories
        # var/ is where the cache and logs go. public/uploads is gitignored but the
        # avatar upload writes there.
        run: mkdir -p var/cache var/log public/uploads

      - name: Create the test database
        # The project deploys with doctrine:schema:update, not with migrations
        # (src/Migrations is abandoned), so the test database is built from the
        # entity metadata the same way.
        run: |
          php bin/console doctrine:schema:create --no-interaction
          php bin/console messenger:setup-transports --no-interaction

      - name: Route registry matches the router
        # tests/Support/Routes.php is what the sweeps iterate over, so a route that
        # is added to a controller and never registered would go untested while
        # every test still passed.
        run: php tests/Support/check-routes.php

      - name: Unit tests
        run: php phpunit.phar --configuration phpunit.xml.dist --testsuite unit

      - name: Functional tests
        # The application is started here rather than in its own step so that the
        # server cannot outlive the tests, and so its log is captured when a test
        # fails. --fail-on-skipped because every functional test skips itself when
        # SMOKE_BASE_URL is missing: without this flag a typo in that variable
        # would turn the whole suite into a silent pass.
        run: |
          set -uo pipefail

          php -S 127.0.0.1:8000 -t public public/index.php > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!

          ready=no
          for _ in $(seq 1 30); do
            # Any HTTP answer means it is listening; an unsigned request gets 401.
            if curl -s -o /dev/null http://127.0.0.1:8000/tag/hot; then ready=yes; break; fi
            sleep 1
          done

          if [ "$ready" != yes ]; then
            echo "::error::the application never started answering on 127.0.0.1:8000"
            cat "$RUNNER_TEMP/server.log"
            kill "$server" 2>/dev/null || true
            exit 1
          fi

          SMOKE_BASE_URL=http://127.0.0.1:8000 \
          SMOKE_MAILHOG_URL=http://127.0.0.1:8025 \
            php phpunit.phar --configuration phpunit.xml.dist --testsuite functional --fail-on-skipped \
            2>&1 | tee "$RUNNER_TEMP/phpunit-functional.txt"
          status=${PIPESTATUS[0]}

          kill "$server" 2>/dev/null || true
          wait "$server" 2>/dev/null || true

          if [ "$status" -ne 0 ]; then
            echo "--- application log (last 200 lines) ---"
            tail -200 "$RUNNER_TEMP/server.log"

            # Also emit annotations. The job log needs admin rights to read, so
            # without these a red run on this (public) repository is invisible from
            # the outside - which is how the first version of this job failed.
            php tests/Support/annotate-failures.php "$RUNNER_TEMP/phpunit-functional.txt" || true
          fi

          exit "$status"

      - name: Route coverage report
        # Answers "which routes ran, and which files does that reach" from the
        # probe log the functional suite wrote, plus the router itself. Always
        # runs, so a failing functional run still produces the evidence.
        if: always()
        run: |
          php tests/Support/route-coverage.php | tee "$RUNNER_TEMP/route-coverage.md"

      - name: Upload the coverage report and the probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-coverage
          path: |
            ${{ runner.temp }}/route-coverage.md
            var/smoke-report.jsonl
          if-no-files-found: warn
