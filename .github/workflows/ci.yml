name: CI

on:
  push:
    branches: [master]
  pull_request:

# The job only reads the repository.
permissions:
  contents: read

jobs:
  tests:
    name: Lint + tests (PHP 7.3)
    runs-on: ubuntu-22.04

    # APP_ENV and the DSNs are given as real environment variables rather than left
    # to the committed .env.test alone.
    #
    # APP_ENV has to be a real one either way: config/bootstrap.php chooses WHICH
    # dotenv file to load based on APP_ENV, so a value that only exists inside
    # .env.test cannot select itself.
    #
    # The rest are here because relying on .env.test for them did not work: the
    # application answered with Symfony's error page reading
    # `Environment variable not found: "FROM_EMAIL"`, with no .env.test value
    # reaching it, even though the console steps had clearly loaded DATABASE_URL
    # from the same file. "What .env.test contributes" below reports what bootstrap
    # actually sees, and the next step is the reason for the duplication.
    env:
      APP_ENV: test
      APP_DEBUG: '0'
      APP_SECRET: test-only-not-a-secret
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/simple_test
      MAILER_DSN: smtp://127.0.0.1:1025
      FROM_EMAIL: from@example.test
      DEV_EMAIL: dev@example.test
      MESSENGER_TRANSPORT_DSN: sync://
      REDIS_DSN: redis://127.0.0.1:6379
      CORS_ALLOW_ORIGIN: '*'

    # The functional suite drives the application over real HTTP, so the services
    # the application itself needs have to be here: MySQL because the schema uses
    # enum columns and there is no SQLite fallback, and MailHog because the
    # registration and password-change flows mail a six-digit code that is never
    # returned in a response - reading it back out of MailHog is the only way to
    # exercise them end to end.
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: simple_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 7.3
        uses: shivammathur/setup-php@v2
        with:
          # Matches docker/php/Dockerfile and composer.json ("php": "^7.1.3").
          php-version: '7.3'
          # The same set the image installs: composer.json requires ctype, iconv,
          # json, bcmath and openssl, and the bundles need the rest.
          extensions: bcmath, ctype, iconv, intl, mbstring, openssl, pdo_mysql, zip
          # No coverage driver: the functional tests are served by a separate PHP
          # process, so their coverage cannot be collected here anyway, and Xdebug
          # makes every run slower. See tests/Support/route-coverage.php.
          coverage: none
          # Composer 1, installed by setup-php rather than downloaded by hand.
          #
          # composer.lock pins symfony/flex v1.4.5 and ocramius/package-versions
          # 1.4.0, both of which declare "composer-plugin-api": "^1.0"; Composer 2
          # provides 2.2.0 and refuses the lock outright.
          #
          # This replaced a hand-rolled curl of composer.phar into $RUNNER_TEMP.
          # That step failed four times on this repository with two different
          # symptoms - a truncated download, and then a file whose sha256 was
          # exactly right and which nonetheless exited 1 with no output when PHP
          # ran it - and it stops the job before any test can run. setup-php's own
          # installer is the better-tested path, and asking for v1 explicitly is
          # what keeps setup-php's default v2 from winning: earlier notes here
          # warned about Composer 2 being the one that runs, which was true when
          # the version was left to chance. The step below still verifies it.
          tools: composer:v1

      - name: Diagnostics
        # Cheap, and it means a failure in this job explains itself instead of
        # needing a guess from the outside.
        run: |
          echo "user          : $(id -un) (uid $(id -u))"
          echo "php           : $(php -v | head -1)"
          echo "composer PATH : $(command -v composer || echo none)"
          composer --version 2>/dev/null | head -1 || true
          echo "RUNNER_TEMP   : $RUNNER_TEMP (writable: $([ -w "$RUNNER_TEMP" ] && echo yes || echo no))"
          echo "workdir       : $PWD"
          echo "APP_ENV       : $APP_ENV"

      - name: Restore the pinned tool phars
        # Fetching the pinned phars has failed intermittently on this repository -
        # repeatedly, sometimes with an unchanged workflow - and it stops the job
        # before any test runs. The versions never change, so caching them means
        # only the first run has to reach the network at all. (Composer 1 is no
        # longer in this group; setup-php installs it.)
        id: tools
        uses: actions/cache@v4
        with:
          path: phpunit.phar
          key: ci-tools-phpunit-9.6.38

      - name: Composer 1 is the one on PATH
        # Verifies rather than assumes. The lock cannot be installed with Composer
        # 2, and a silent fallback to it would fail later with a confusing message
        # about composer-plugin-api.
        run: |
          set +e
          version=$(composer --version 2>&1 | head -1)
          echo "composer: $version"
          if ! printf '%s' "$version" | grep -q '^Composer version 1\.'; then
            echo "::error::expected Composer 1.x on PATH, got: ${version:-nothing}"
            exit 1
          fi

      - name: Install dependencies
        # --no-scripts: the auto-scripts boot the kernel (cache:clear,
        # assets:install), which wants a .env and the gitignored
        # config/certificate keys that do not exist yet at this point. Both are
        # created by the next two steps, and nothing here needs a booted kernel.
        run: composer install --no-scripts --no-interaction --prefer-dist --no-progress

      - name: composer.json is still valid
        # --no-check-lock on purpose. The lock has been stale for a long time
        # ("not up to date with the latest changes in composer.json"), which is a
        # genuine pre-existing problem, but without this flag the step exits 2 on
        # every run and the signal drowns in the noise. Worth fixing separately.
        run: composer validate --no-check-publish --no-check-lock

      - name: Every PHP file parses
        run: |
          out=$(find src tests -name '*.php' -print0 | xargs -0 -n1 php -l)
          bad=$(printf '%s\n' "$out" | grep -v '^No syntax errors detected' || true)
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "Parsed $(printf '%s\n' "$out" | wc -l) files"

      - name: Install PHPUnit
        # A pinned phar rather than a composer dependency: `composer require`
        # cannot work here (Composer 1 is required, and composer.json still points
        # at the dead packagist.phpcomposer.com), and adding it to the lock would
        # re-resolve a dependency set that is deliberately frozen.
        #
        # 9.6.38 is the last 9.6 release and supports PHP 7.3. The hash is pinned
        # because an exact-version phar is immutable, so a changed hash means a
        # changed artifact. The hash was computed from the artifact itself, not
        # read from a signed release listing - phar.phpunit.de publishes no
        # .sha256 file for these.
        run: |
          set +e

          expected=6b5235f282c6ccab3674ac27c5b1ddbd1da838e74bf07002ddcfd030d31298d7
          ok=no
          if [ -f phpunit.phar ] && [ "$(sha256sum phpunit.phar | cut -d' ' -f1)" = "$expected" ]; then
            ok=yes
            echo "reusing the cached phpunit.phar"
          fi

          for attempt in 1 2 3 4 5; do
            [ "$ok" = yes ] && break
            rm -f phpunit.phar
            curl -sSL --retry 5 --retry-delay 3 --retry-connrefused --retry-all-errors --max-time 300 \
              -o phpunit.phar https://phar.phpunit.de/phpunit-9.6.38.phar
            got=$(sha256sum phpunit.phar 2>/dev/null | cut -d' ' -f1)
            echo "attempt $attempt -> $(wc -c < phpunit.phar 2>/dev/null || echo 0) bytes, sha256 ${got:-none}"
            if [ "$got" = "$expected" ]; then ok=yes; break; fi
            sleep 5
          done

          version=$(php phpunit.phar --version 2>&1 | head -1)
          echo "ok=$ok version=$version"

          if [ "$ok" != yes ] || ! printf '%s' "$version" | grep -q '^PHPUnit 9\.6'; then
            echo "::error::could not obtain a verified PHPUnit phar ($version)"
            exit 1
          fi

      - name: Give the kernel a .env, with APP_ENV in it
        # Two things have to hold for the test environment to be the one that runs,
        # and only one of them was true before.
        #
        # .env has to exist: config/bootstrap.php calls Dotenv::loadEnv()
        # unconditionally, and Symfony's Dotenv throws PathException when the file
        # is not readable.
        #
        # APP_ENV has to be *in* it. loadEnv() decides which dotenv file to load by
        # reading $_SERVER and $_ENV, and the runner's environment does not reach
        # those - getenv() reports APP_ENV=test while $_SERVER does not have it, so
        # this build's variables_order has no E. Dotenv therefore fell back to its
        # own default of "dev", the kernel loaded config/packages/dev instead of
        # config/packages/test, and cache.app stayed on cache.adapter.redis:
        #
        #   no Redis on the runner
        #     -> AbstractAdapter::save() swallows the connection error
        #     -> VerificationCode::sendCode() answered 发送成功 without storing the code
        #     -> POST /user/register answered 404 请获取验证码
        #
        # That is why one route pair failed while the rest of the suite passed: the
        # job env below supplies the DSNs, so a dev-mode application still booted
        # and served most routes. var/log/dev.log, written in a checkout that tracks
        # nothing under var/, is what gave it away.
        run: printf 'APP_ENV=test\n' > .env

      - name: Generate the RSA key pairs
        # config/certificate is gitignored, and App\Service\Token (RS256) and
        # App\Service\Signature both read their keys from it. These are throwaway
        # keys for one run: nothing is pinned against them outside this job.
        run: sh docker/gen-certificates.sh --bits 2048

      - name: Prepare the runtime directories
        # var/ is where the cache and logs go. public/uploads is gitignored but the
        # avatar upload writes there.
        run: mkdir -p var/cache var/log public/uploads

      - name: Create the test database
        # The project deploys with doctrine:schema:update, not with migrations
        # (src/Migrations is abandoned), so the test database is built from the
        # entity metadata the same way.
        run: |
          php bin/console doctrine:schema:create --no-interaction
          php bin/console messenger:setup-transports --no-interaction

      - name: Route registry matches the router
        # tests/Support/Routes.php is what the sweeps iterate over, so a route that
        # is added to a controller and never registered would go untested while
        # every test still passed.
        run: php tests/Support/check-routes.php

      - name: What .env.test contributes
        # A warning annotation, so it is readable without admin rights on this
        # repository's logs. It reports what config/bootstrap.php actually ends up
        # with: whether .env.test is in the checkout, and whether its values reached
        # $_ENV. The job env above makes the run independent of that, but knowing
        # which of the two it is explains why the duplication is there.
        run: |
          set +e
          present=$([ -f .env.test ] && echo yes || echo no)
          probe=$(php -r '
            require "config/bootstrap.php";
            printf(
              "APP_ENV=%s APP_DEBUG=%s FROM_EMAIL=%s DATABASE_URL=%s DOTENV_VARS=%s",
              $_SERVER["APP_ENV"] ?? "-",
              $_SERVER["APP_DEBUG"] ?? "-",
              $_ENV["FROM_EMAIL"] ?? "MISSING",
              isset($_ENV["DATABASE_URL"]) ? "set" : "MISSING",
              $_SERVER["SYMFONY_DOTENV_VARS"] ?? "unset"
            );
          ' 2>&1 | tail -1)
          echo "::warning::env probe: .env.test present=$present; $probe"

      - name: Unit tests
        run: php phpunit.phar --configuration phpunit.xml.dist --testsuite unit

      - name: Functional tests
        # The application is started here rather than in its own step so that the
        # server cannot outlive the tests, and so its log is captured when a test
        # fails. --fail-on-skipped because every functional test skips itself when
        # SMOKE_BASE_URL is missing: without this flag a typo in that variable
        # would turn the whole suite into a silent pass.
        run: |
          set -uo pipefail

          php -S 127.0.0.1:8000 -t public public/index.php > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!

          ready=no
          for _ in $(seq 1 30); do
            # Any HTTP answer means it is listening; an unsigned request gets 401.
            if curl -s -o /dev/null http://127.0.0.1:8000/tag/hot; then ready=yes; break; fi
            sleep 1
          done

          if [ "$ready" != yes ]; then
            echo "::error::the application never started answering on 127.0.0.1:8000"
            cat "$RUNNER_TEMP/server.log"
            kill "$server" 2>/dev/null || true
            exit 1
          fi

          # -e is on by default in GitHub's run steps, and `set -uo pipefail` does
          # not turn it off. Without this, the first failing pipeline below ends the
          # step immediately - taking the server cleanup, the log tail and the
          # annotations with it, which is exactly what happened the first time this
          # job ran red.
          set +e

          SMOKE_BASE_URL=http://127.0.0.1:8000 \
          SMOKE_MAILHOG_URL=http://127.0.0.1:8025 \
            php phpunit.phar --configuration phpunit.xml.dist --testsuite functional --fail-on-skipped \
            2>&1 | tee "$RUNNER_TEMP/phpunit-functional.txt"
          status=${PIPESTATUS[0]}

          set -e

          kill "$server" 2>/dev/null || true
          wait "$server" 2>/dev/null || true

          if [ "$status" -ne 0 ]; then
            echo "--- application log (last 200 lines) ---"
            tail -200 "$RUNNER_TEMP/server.log"

            # Also emit annotations. The job log needs admin rights to read, so
            # without these a red run on this (public) repository is invisible from
            # the outside - which is how the first version of this job failed.
            SMOKE_SERVER_LOG="$RUNNER_TEMP/server.log" \
              php tests/Support/annotate-failures.php "$RUNNER_TEMP/phpunit-functional.txt" \
              || echo "::error::annotate-failures.php itself did not run; see the log"
          fi

          exit "$status"

      - name: Route coverage report
        # Answers "which routes ran, and which files does that reach" from the
        # probe log the functional suite wrote, plus the router itself. Always
        # runs, so a failing functional run still produces the evidence.
        if: always()
        run: |
          php tests/Support/route-coverage.php | tee "$RUNNER_TEMP/route-coverage.md"

      - name: Upload the coverage report and the probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-coverage
          path: |
            ${{ runner.temp }}/route-coverage.md
            var/smoke-report.jsonl
          if-no-files-found: warn
