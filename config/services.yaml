# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    page.page: 1
    page.size: 15
    # for JWT
    jwt.private: '/config/certificate/jwt/rsa_private.pem'
    jwt.public: '/config/certificate/jwt/rsa_public.pem'
    # for sign with request
    sign.private: '/config/certificate/sign/rsa_private.pem'
    sign.public: '/config/certificate/sign/rsa_public.pem'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $page: '%page.page%'
            $size: '%page.size%'
            $projectDirectory: "%kernel.project_dir%"

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/*'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # ---------------------------------------------------------------------------
    # Exception -> JSON rendering.
    #
    # This project carries TWO implementations of the same thing, and you pick one:
    #
    #   (A) App\EventSubscriber\Exception   <- ACTIVE
    #   (B) App\EventListener\Exception     <- commented out below, kept as an option
    #
    # They hold the same logic; only the namespace and the handler method name
    # differ (onExceptionEvent() vs onKernelException()). Both produce the same
    # response - swapping them was tested and returns byte-identical JSON.
    #
    # Why (B) needs a tag and (A) does not:
    #   (A) implements EventSubscriberInterface and declares getSubscribedEvents(),
    #       so `autoconfigure: true` above tags it with no configuration at all.
    #   (B) is a plain class. Autoconfigure only adds kernel.event_subscriber to
    #       EventSubscriberInterface implementations, so (B) never self-registers
    #       and needs the explicit tag below.
    #   For a listener the tag names the EVENT, not the method: Symfony derives the
    #   method as 'on' + the camel-cased event name, so `event: kernel.exception`
    #   resolves to onKernelException(). A subscriber names its own method in
    #   getSubscribedEvents(), which is why (A) can call it something else.
    #
    # TO SWITCH FROM (A) TO (B), all three steps - the third one is easy to miss:
    #   1. uncomment the block below
    #   2. comment out the App\EventSubscriber\Exception definition further down
    #   3. add EventSubscriber/Exception.php to the `exclude` list of the App\:
    #      resource near the top of this file
    #
    # Step 3 is not optional. Removing only the definition (step 2) leaves the class
    # still auto-registered by `App\:`, and since its constructor takes untyped
    # $env/$from/$dev that autowire cannot resolve, the container fails to compile:
    #   Cannot autowire service "App\EventSubscriber\Exception": argument "$env" of
    #   method "__construct()" has no type-hint, you should configure its value
    #   explicitly.
    # (Alternatively keep the definition, keep its `arguments:` and set
    # `autoconfigure: false` on it - that also stops it self-registering.)
    #
    # Leaving BOTH wired up is not an error: the container compiles and the response
    # is rendered once, because ExceptionEvent inherits setResponse() from
    # GetResponseEvent and that calls stopPropagation(), so the first handler to
    # build a response ends the chain. But only one of them ever runs, and which is
    # decided by registration order - so editing the other one silently does
    # nothing. Keep exactly one wired.
    # ---------------------------------------------------------------------------
#    App\EventListener\Exception:
#        tags:
#            - { name: kernel.event_listener, event: kernel.exception }
#        arguments:
#            $env: '%env(APP_ENV)%'
#            $from: '%env(FROM_EMAIL)%'
#            $dev: '%env(DEV_EMAIL)%'

    App\EventSubscriber\Exception:
        tags:
            - { name: kernel.event_subscriber, event: kernel.exception }
        arguments:
            $env: '%env(APP_ENV)%'
            $from: '%env(FROM_EMAIL)%'
            $dev: '%env(DEV_EMAIL)%'

    App\EventListener\Request:
        tags:
            - { name: kernel.event_listener, event: kernel.request }
        arguments:
            $env: '%env(APP_ENV)%'

    Symfony\Bundle\TwigBundle\Controller\ExceptionController: '@twig.controller.exception'

    App\Service\VerificationCode:
        arguments:
            $from: '%env(FROM_EMAIL)%'

    # The sign-up mail used to hardcode a real address in the handler. Take it
    # from the environment like VerificationCode and the exception subscriber do.
    App\MessageHandler\SignUpNotificationHandler:
        arguments:
            $from: '%env(FROM_EMAIL)%'

    App\Service\Signature:
        arguments:
            $public: '%sign.public%'
            $private: '%sign.private%'
            $timeout: 7000
            $onceExpire: 60

    App\Service\Token:
        arguments:
            $public: '%jwt.public%'
            $private: '%jwt.private%'
            $type: 'RS256'
            $expire: 86400